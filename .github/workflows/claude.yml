name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  claude-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code              # ← add this
        uses: actions/checkout@v4
        with:
          fetch-depth: 0                 # full history so git diff works

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            You are a senior code reviewer for LTS Datapoint, a Symfony 6.4 multi-tenant SaaS application.
            Review PR #${{ github.event.pull_request.number }} and post a structured review comment with these sections:
            ## Critical Issues (must fix before merge)
            ## Warnings (should fix)
            ## Info (suggestions)
            Check specifically for:
            - No business logic in controllers (use Handlers)
            - All DB access via Repositories only, never EntityManager directly
            - All queries MUST use TenantContext (flag missing tenant filter as Critical)
            - Entity naming must use Dp* prefix, no constructors, no ArrayCollection
            - No debug code: dd(), dump(), var_dump(), console.log(), {{ dump() }}
            - Security: SQL injection, XSS, CSRF token in forms
            - N+1 query risks
            - PSR-1 and PSR-12 coding standards
          claude_args: |
            --max-turns 10
            --model claude-sonnet-4-6
